name: Build OpenDex I2405 WCT

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Download official scrcpy-server v4.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -fL --retry 4 --retry-delay 2 \
            https://github.com/Genymobile/scrcpy/releases/download/v4.1/scrcpy-server-v4.1 \
            -o app/src/main/assets/scrcpy-server-v4.1
          echo "deacb991ed2509715160ffdc7907e47b4160eb30d1566217e9047fd5b8850cae  app/src/main/assets/scrcpy-server-v4.1" | sha256sum -c -

      - name: Source preflight
        run: python3 scripts/preflight.py

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      # Upload a successful compile before lint so phone-only testers can still
      # retrieve the APK if a future non-compile lint regression appears.
      - name: Prepare artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OpenDex-v0.7.5-I2405-WCT-debug.apk
          sha256sum out/OpenDex-v0.7.5-I2405-WCT-debug.apk | tee out/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenDex-v0.7.5-I2405-WCT-debug
          path: out/*
          if-no-files-found: error

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace
