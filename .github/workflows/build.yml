name: Build I2405 WCT Probe

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OpenDex-I2405-WCT-Probe-v0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenDex-I2405-WCT-Probe-v0.1
          path: out/OpenDex-I2405-WCT-Probe-v0.1-debug.apk
          if-no-files-found: error
