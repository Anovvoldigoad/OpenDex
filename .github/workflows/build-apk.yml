name: Build DroidUP Android Host

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Source preflight
        run: python3 scripts/preflight.py

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/DroidUP-AndroidHost-v0.4.0-debug.apk
          sha256sum out/DroidUP-AndroidHost-v0.4.0-debug.apk | tee out/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidUP-AndroidHost-v0.4.0-debug
          path: out/*
          if-no-files-found: error

      - name: Lint (advisory)
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug --stacktrace
