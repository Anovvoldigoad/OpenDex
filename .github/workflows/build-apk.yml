name: Build OpenDex APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Android CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Source preflight
        run: python3 scripts/preflight.py

      - name: Show toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OpenDex-v0.3.1-debug.apk
          sha256sum dist/OpenDex-v0.3.1-debug.apk > dist/OpenDex-v0.3.1-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: OpenDex-v0.3.1-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 30
